<!DOCTYPE html>
<html lang="en" class="dark"> <!-- Defaulting to dark mode for the muted look -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Image Splitter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neutral: {
                            950: '#0a0a0a',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .drag-active {
            border-color: #b91c1c !important; /* red-700 */
            background-color: rgba(185, 28, 28, 0.05) !important;
        }
        
        /* Smooth scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d6d3d1; 
            border-radius: 4px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #404040; 
        }
        
        /* Premium Raised Button Styles (Light Mode - Muted) */
        .btn-surface {
            background: linear-gradient(to bottom, #f5f5f4, #e7e5e4);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.6);
            border: 1px solid #d6d3d1;
            color: #57534e;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-surface:hover:not(.active-btn) {
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.8);
            transform: translateY(-1px);
            border-color: #a8a29e;
        }
        .btn-surface svg {
            color: #78716c;
            transition: color 0.2s ease;
        }
        
        /* Active State (Light Mode) */
        .btn-surface.active-btn {
            background: linear-gradient(to bottom, #292524, #1c1917);
            border-color: #1c1917;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
            color: #ffffff;
            transform: translateY(0);
        }
        .btn-surface.active-btn svg {
            color: #ffffff;
        }

        /* Premium Raised Button Styles (Dark Mode) */
        .dark .btn-surface {
            background: linear-gradient(to bottom, #262626, #171717);
            border: 1px solid #404040;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.05);
            color: #a3a3a3;
        }
        .dark .btn-surface:hover:not(.active-btn) {
            border-color: #525252;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .dark .btn-surface svg {
            color: #737373;
        }
        
        /* Active State (Dark Mode - Red Accent) */
        .dark .btn-surface.active-btn {
            background: linear-gradient(to bottom, #b91c1c, #991b1b);
            border-color: #7f1d1d;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4), 0 1px 3px rgba(185, 28, 28, 0.3);
            color: #ffffff;
        }
        .dark .btn-surface.active-btn svg {
            color: #ffffff;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 bg-stone-200 dark:bg-neutral-950 text-stone-800 dark:text-neutral-200">

    <div class="max-w-4xl w-full bg-stone-100 dark:bg-neutral-900 rounded-xl shadow-2xl flex flex-col md:flex-row overflow-hidden min-h-[550px] border border-stone-300 dark:border-neutral-800 transition-colors duration-300">
        
        <!-- Left Panel: Controls & Upload -->
        <div class="w-full md:w-[45%] flex flex-col border-r border-stone-300 dark:border-neutral-800 bg-stone-50/50 dark:bg-neutral-900/50 transition-colors duration-300">
            
            <div class="p-6 md:p-8 flex-grow flex flex-col relative">
                
                <div class="mb-6 flex items-center justify-between">
                    <div class="flex items-center">
                        <div class="w-2.5 h-6 bg-red-800 dark:bg-red-700 mr-3 rounded-sm shadow-[0_0_8px_rgba(153,27,27,0.5)]"></div>
                        <div>
                            <h1 class="text-xl font-medium tracking-tight text-stone-900 dark:text-neutral-100">Image Splitter</h1>
                            <p class="text-[10px] text-stone-500 dark:text-neutral-500 uppercase tracking-wider mt-0.5">100% Private &bull; Offline</p>
                        </div>
                    </div>
                    
                    <!-- Theme Toggle Button -->
                    <button id="theme-toggle" class="p-2 rounded-full hover:bg-stone-200 dark:hover:bg-neutral-800 transition-colors text-stone-500 dark:text-neutral-400 focus:outline-none">
                        <!-- Sun Icon (Hidden in Light Mode) -->
                        <svg id="icon-sun" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                        <!-- Moon Icon (Hidden in Dark Mode) -->
                        <svg id="icon-moon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                        </svg>
                    </button>
                </div>

                <div id="error-message" class="hidden mb-4 p-2.5 bg-red-100 dark:bg-red-900/30 text-red-800 dark:text-red-400 text-xs rounded-md border border-red-200 dark:border-red-800/50"></div>

                <div id="drop-zone" class="border border-dashed border-stone-300 dark:border-neutral-700 rounded-lg p-8 text-center cursor-pointer hover:bg-stone-200/50 dark:hover:bg-neutral-800/50 transition-colors duration-200 mb-4 flex-grow flex flex-col justify-center items-center">
                    <svg class="h-8 w-8 text-stone-400 dark:text-neutral-500 mb-3" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <div class="text-xs text-stone-600 dark:text-neutral-400 mb-1">
                        <label for="file-upload" class="relative cursor-pointer rounded-md font-medium text-stone-900 dark:text-neutral-200 hover:text-red-700 dark:hover:text-red-500 transition-colors">
                            <span>Upload a file</span>

                        <span>or drag and drop</span>
                    </div>
                    <p class="text-[10px] text-stone-400 dark:text-neutral-500 mt-1">PNG, JPG, WEBP</p>
                </div>

                <div id="controls-area" class="hidden flex-col w-full opacity-0 transition-opacity duration-500 h-full">
                    
                    <div class="flex justify-between items-end mb-2">
                        <h3 class="text-xs font-medium text-stone-700 dark:text-neutral-300">Layout Selection</h3>
                        <button id="btn-reset" class="text-[10px] text-stone-500 dark:text-neutral-500 hover:text-red-700 dark:hover:text-red-400 underline transition-colors">New Image</button>
                    </div>

                    <div class="grid grid-cols-4 gap-2 mb-4">

                        <!-- 3 Rows -->
                        <button id="btn-horiz-3" class="btn-surface flex flex-col items-center justify-center py-2 px-1 rounded-lg focus:outline-none h-14">
                            <svg class="w-4 h-4 mb-1 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <rect x="3" y="3" width="18" height="18" rx="2" stroke-width="1.5"/>
                                <line x1="3" y1="9" x2="21" y2="9" stroke-width="1.5"/>

                                <line x1="3" y1="12" x2="21" y2="12" stroke-width="1.5"/>

                            <span class="text-[8px] font-medium pointer-events-none tracking-wider">4 ROWS</span>

                            </svg>
                            <span class="text-[8px] font-medium pointer-events-none tracking-wider">2x2 GRID</span>
                        </button>
                        <!-- 2 Cols -->
                        <button id="btn-vert-2" class="btn-surface flex flex-col items-center justify-center py-2 px-1 rounded-lg focus:outline-none h-14">
                            <svg class="w-4 h-4 mb-1 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <rect x="3" y="3" width="18" height="18" rx="2" stroke-width="1.5"/>
                                <line x1="12" y1="3" x2="12" y2="21" stroke-width="1.5"/>
                            </svg>
                            <span class="text-[8px] font-medium pointer-events-none tracking-wider">2 COLS</span>
                        </button>
                        <!-- 3 Cols -->
                        <button id="btn-vert-3" class="btn-surface flex flex-col items-center justify-center py-2 px-1 rounded-lg focus:outline-none h-14">
                            <svg class="w-4 h-4 mb-1 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <rect x="3" y="3" width="18" height="18" rx="2" stroke-width="1.5"/>
                                <line x1="9" y1="3" x2="9" y2="21" stroke-width="1.5"/>
                                <line x1="15" y1="3" x2="15" y2="21" stroke-width="1.5"/>
                            </svg>
                            <span class="text-[8px] font-medium pointer-events-none tracking-wider">3 COLS</span>
                        </button>
                        <!-- 4 Cols -->
                        <button id="btn-vert-4" class="btn-surface flex flex-col items-center justify-center py-2 px-1 rounded-lg focus:outline-none h-14">
                            <svg class="w-4 h-4 mb-1 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <rect x="3" y="3" width="18" height="18" rx="2" stroke-width="1.5"/>
                                <line x1="7.5" y1="3" x2="7.5" y2="21" stroke-width="1.5"/>
                                <line x1="12" y1="3" x2="12" y2="21" stroke-width="1.5"/>
                                <line x1="16.5" y1="3" x2="16.5" y2="21" stroke-width="1.5"/>
                            </svg>
                            <span class="text-[8px] font-medium pointer-events-none tracking-wider">4 COLS</span>
                        </button>
                    </div>

                    <div class="mt-auto pt-4">
                        <button id="btn-download-all" class="w-full bg-gradient-to-b from-red-700 to-red-800 hover:from-red-600 hover:to-red-700 text-white text-sm font-medium py-2.5 px-4 rounded-lg shadow-[0_2px_4px_rgba(0,0,0,0.1),inset_0_1px_0_rgba(255,255,255,0.2)] border border-red-900 transition-all flex justify-center items-center opacity-0 pointer-events-none focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 dark:focus:ring-offset-neutral-900">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Download Split Pieces
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full md:w-[55%] bg-stone-200/50 dark:bg-neutral-950/50 flex flex-col p-6 relative transition-colors duration-300 border-l border-stone-200 dark:border-neutral-800">
            
            <!-- Empty state -->
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-stone-400 dark:text-neutral-600 p-8 text-center transition-opacity duration-300">
                <svg class="w-10 h-10 mb-3 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <p class="text-[11px] uppercase tracking-widest">Awaiting Image</p>
            </div>

            <!-- Content state -->
            <div id="content-state" class="hidden flex-col h-full opacity-0 transition-opacity duration-500">
                <!-- Original Preview -->
                <div class="mb-4">
                    <div class="flex justify-between items-center mb-1.5">
                        <h3 class="text-[10px] font-semibold text-stone-500 dark:text-neutral-500 uppercase tracking-widest">Original</h3>
                    </div>
                    <div class="w-full bg-white dark:bg-neutral-900 border border-stone-300 dark:border-neutral-800 rounded-lg overflow-hidden shadow-sm flex justify-center items-center h-32 p-2 relative bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZjBmMGYwIiAvPgo8cmVjdCB4PSI0IiB5PSI0IiB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZjBmMGYwIiAvPgo8L3N2Zz4=')] dark:bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjMjYyNjI2IiAvPgo8cmVjdCB4PSI0IiB5PSI0IiB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjMjYyNjI2IiAvPgo8L3N2Zz4=')] transition-colors duration-300">
                        <img id="original-preview" src="" alt="Original Preview" class="max-w-full max-h-full object-contain relative z-10 shadow-sm border border-stone-100 dark:border-neutral-700">
                    </div>
                </div>

                <div class="flex-grow flex flex-col min-h-0">
                    <div class="flex justify-between items-center mb-1.5 mt-2">
                        <h3 class="text-[10px] font-semibold text-stone-500 dark:text-neutral-500 uppercase tracking-widest">Results</h3>
                        <span id="results-count" class="text-[10px] text-stone-400 dark:text-neutral-600 bg-stone-200 dark:bg-neutral-800 px-2 py-0.5 rounded-full">0 pieces</span>
                    </div>
                    
                    <div id="pieces-container" class="flex-grow overflow-y-auto custom-scrollbar flex flex-col gap-2 pr-2 pb-2">
                        <!-- Split images injected here -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme Logic
            const htmlEl = document.documentElement;
            const themeToggleBtn = document.getElementById('theme-toggle');
            
            // Check local storage or system preference
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlEl.classList.add('dark');
            } else {
                htmlEl.classList.remove('dark');
            }

            themeToggleBtn.addEventListener('click', () => {
                htmlEl.classList.toggle('dark');
                if (htmlEl.classList.contains('dark')) {
                    localStorage.theme = 'dark';
                } else {
                    localStorage.theme = 'light';
                }
            });

            // DOM Elements
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-upload');
            const controlsArea = document.getElementById('controls-area');
            const emptyState = document.getElementById('empty-state');
            const contentState = document.getElementById('content-state');
            const piecesContainer = document.getElementById('pieces-container');
            const originalPreview = document.getElementById('original-preview');
            const errorMessage = document.getElementById('error-message');
            const resultsCount = document.getElementById('results-count');
            
            const splitBtns = {
                'horiz-2': { el: document.getElementById('btn-horiz-2'), dir: 'horizontal', num: 2 },
                'horiz-3': { el: document.getElementById('btn-horiz-3'), dir: 'horizontal', num: 3 },
                'horiz-4': { el: document.getElementById('btn-horiz-4'), dir: 'horizontal', num: 4 },
                'grid-4':  { el: document.getElementById('btn-grid-4'), dir: 'grid', num: 4 },
                'vert-2':  { el: document.getElementById('btn-vert-2'), dir: 'vertical', num: 2 },
                'vert-3':  { el: document.getElementById('btn-vert-3'), dir: 'vertical', num: 3 },
                'vert-4':  { el: document.getElementById('btn-vert-4'), dir: 'vertical', num: 4 }
            };
            const splitOptionBtns = document.querySelectorAll('.btn-surface');
            
            const btnReset = document.getElementById('btn-reset');
            const btnDownloadAll = document.getElementById('btn-download-all');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            let currentImage = null;
            let currentFileName = '';
            let currentFileType = '';
            let splitPiecesDataUrls = [];
            let currentSplitConfig = { dir: null, num: null };

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('drag-active');
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-active');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-active');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });

            function showError(msg) {
                errorMessage.textContent = msg;
                errorMessage.classList.remove('hidden');
                setTimeout(() => {
                    errorMessage.classList.add('hidden');
                }, 4000);
            }

            function handleFile(file) {
                if (!file.type.match('image.*')) {
                    showError('Please upload a valid image file (JPG, PNG, or WEBP).');
                    return;
                }
                
                errorMessage.classList.add('hidden');
                currentFileName = file.name.split('.')[0] || 'image';
                currentFileType = file.type;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        currentImage = img;
                        showUIReadyState();
                    };
                    img.src = e.target.result;
                    originalPreview.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            function showUIReadyState() {
                dropZone.classList.add('hidden');
                controlsArea.classList.remove('hidden');
                setTimeout(() => controlsArea.classList.remove('opacity-0'), 50);
                
                emptyState.classList.add('opacity-0');
                setTimeout(() => {
                    emptyState.classList.add('hidden');
                    contentState.classList.remove('hidden');
                    setTimeout(() => contentState.classList.remove('opacity-0'), 50);
                }, 300);

                resetOptionButtons();
                piecesContainer.innerHTML = '';
                resultsCount.textContent = '0 pieces';
                btnDownloadAll.classList.add('opacity-0', 'pointer-events-none');
                splitPiecesDataUrls = [];
                
                triggerSplitOption('horiz-3'); // Default to 3 rows
            }

            btnReset.addEventListener('click', () => {
                currentImage = null;
                fileInput.value = '';
                
                controlsArea.classList.add('opacity-0');
                contentState.classList.add('opacity-0');
                
                setTimeout(() => {
                    controlsArea.classList.add('hidden');
                    contentState.classList.add('hidden');
                    dropZone.classList.remove('hidden');
                    emptyState.classList.remove('hidden');
                    setTimeout(() => emptyState.classList.remove('opacity-0'), 50);
                }, 500);
            });

            function resetOptionButtons() {
                splitOptionBtns.forEach(btn => {
                    btn.classList.remove('active-btn');
                });
            }

            function setActiveLayoutButton(activeBtn) {
                resetOptionButtons();
                activeBtn.classList.add('active-btn');
            }

            Object.keys(splitBtns).forEach(key => {
                const config = splitBtns[key];
                config.el.addEventListener('click', () => triggerSplitOption(key));
            });

            function triggerSplitOption(key) {
                const config = splitBtns[key];
                setActiveLayoutButton(config.el);
                currentSplitConfig.dir = config.dir;
                currentSplitConfig.num = config.num;
                executeSplit();
            }

            function executeSplit() {
                if (!currentImage || !currentSplitConfig.dir) return;

                piecesContainer.innerHTML = '';
                splitPiecesDataUrls = [];
                
                const imgWidth = currentImage.width;
                const imgHeight = currentImage.height;
                const { dir, num } = currentSplitConfig;
                
                if (dir === 'horizontal') {
                    const pieceHeight = Math.floor(imgHeight / num);
                    canvas.width = imgWidth;

                    for (let i = 0; i < num; i++) {
                        const currentPieceHeight = (i === num - 1) ? imgHeight - (pieceHeight * i) : pieceHeight;
                        canvas.height = currentPieceHeight;
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(
                            currentImage, 
                            0, i * pieceHeight, imgWidth, currentPieceHeight,
                            0, 0, imgWidth, currentPieceHeight
                        );
                        savePieceData(i);
                    }
                } 
                else if (dir === 'vertical') {
                    const pieceWidth = Math.floor(imgWidth / num);
                    canvas.height = imgHeight;

                    for (let i = 0; i < num; i++) {
                        const currentPieceWidth = (i === num - 1) ? imgWidth - (pieceWidth * i) : pieceWidth;
                        canvas.width = currentPieceWidth;
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(
                            currentImage, 
                            i * pieceWidth, 0, currentPieceWidth, imgHeight,
                            0, 0, currentPieceWidth, imgHeight
                        );
                        savePieceData(i);
                    }
                }
                else if (dir === 'grid') {
                    const cols = 2;
                    const rows = 2;
                    const pieceWidth = Math.floor(imgWidth / cols);
                    const pieceHeight = Math.floor(imgHeight / rows);
                    
                    let pieceIndex = 0;
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const cw = (c === cols - 1) ? imgWidth - (pieceWidth * c) : pieceWidth;
                            const ch = (r === rows - 1) ? imgHeight - (pieceHeight * r) : pieceHeight;
                            
                            canvas.width = cw;
                            canvas.height = ch;
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(
                                currentImage, 
                                c * pieceWidth, r * pieceHeight, cw, ch,
                                0, 0, cw, ch
                            );
                            savePieceData(pieceIndex++);
                        }
                    }
                }

                if (splitPiecesDataUrls.length > 0) {
                    btnDownloadAll.classList.remove('opacity-0', 'pointer-events-none');
                    resultsCount.textContent = `${splitPiecesDataUrls.length} pieces`;
                }
            }

            function savePieceData(index) {
                let dataUrl;
                if (currentFileType === 'image/jpeg') {
                    dataUrl = canvas.toDataURL('image/jpeg', 1.0); 
                } else if (currentFileType === 'image/webp') {
                     dataUrl = canvas.toDataURL('image/webp', 1.0);
                } else {
                    dataUrl = canvas.toDataURL('image/png');
                }

                splitPiecesDataUrls.push({
                    url: dataUrl,
                    index: index + 1,
                    name: `${currentFileName}_part${index + 1}`
                });

                renderPieceUI(dataUrl, index + 1);
            }

            function renderPieceUI(dataUrl, index) {
                const pieceWrapper = document.createElement('div');
                pieceWrapper.className = 'w-full bg-white dark:bg-neutral-900 border border-stone-200 dark:border-neutral-800 rounded-md shadow-sm overflow-hidden flex items-center p-2 gap-3 hover:border-stone-300 dark:hover:border-neutral-700 transition-colors flex-shrink-0';

                const imgContainer = document.createElement('div');
                imgContainer.className = 'w-12 h-12 flex-shrink-0 flex justify-center bg-[url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZjBmMGYwIiAvPgo8cmVjdCB4PSI0IiB5PSI0IiB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZjBmMGYwIiAvPgo8L3N2Zz4=")] dark:bg-[url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjMjYyNjI2IiAvPgo8cmVjdCB4PSI0IiB5PSI0IiB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjMjYyNjI2IiAvPgo8L3N2Zz4=")] rounded border border-stone-100 dark:border-neutral-800 overflow-hidden';
                
                const img = document.createElement('img');
                img.src = dataUrl;
                img.alt = `Piece ${index}`;
                img.className = 'max-w-full max-h-full object-contain';

                imgContainer.appendChild(img);

                const infoContainer = document.createElement('div');
                infoContainer.className = 'flex-1 flex justify-between items-center pr-2';

                const label = document.createElement('span');
                label.className = 'text-xs font-medium text-stone-700 dark:text-neutral-300';
                label.textContent = `Part ${index}`;

                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'btn-surface text-[10px] font-medium py-1 px-2.5 rounded transition flex items-center hover:-translate-y-[1px] focus:outline-none';
                downloadBtn.innerHTML = `
                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Save
                `;
                
                let ext = 'png';
                if(currentFileType === 'image/jpeg') ext = 'jpg';
                if(currentFileType === 'image/webp') ext = 'webp';

                downloadBtn.onclick = () => downloadSingleImage(dataUrl, `${currentFileName}_part${index}.${ext}`);

                infoContainer.appendChild(label);
                infoContainer.appendChild(downloadBtn);

                pieceWrapper.appendChild(imgContainer);
                pieceWrapper.appendChild(infoContainer);

                piecesContainer.appendChild(pieceWrapper);
            }

            function downloadSingleImage(dataUrl, filename) {
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            btnDownloadAll.addEventListener('click', () => {
                let ext = 'png';
                if(currentFileType === 'image/jpeg') ext = 'jpg';
                if(currentFileType === 'image/webp') ext = 'webp';

                splitPiecesDataUrls.forEach((piece, index) => {
                    setTimeout(() => {
                        downloadSingleImage(piece.url, `${piece.name}.${ext}`);
                    }, index * 250); 
                });
            });
        });
    </script>
</body>
</html>
